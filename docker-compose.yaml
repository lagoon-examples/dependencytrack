#####################################################
# This Docker Compose file contains two services
#    Dependency-Track API Server
#    Dependency-Track FrontEnd
#####################################################

x-environment:
  &default-environment
    # Route that should be used locally, if you are using pygmy, this route *must* end with .docker.amazee.io
    LAGOON_ROUTE: &default-url http://${COMPOSE_PROJECT_NAME:-dependencytrack}.docker.amazee.io
    # Uncomment if you like to have the system behave like in production
    #LAGOON_ENVIRONMENT_TYPE: production

x-user:
  &default-user
    # The default user under which the containers should run. Change this if you are on linux and run with another user than id `1000`
    user: '1000'

services:
  apiserver:
    build:
      context: ./.lagoon
      dockerfile: dependencytrack.dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      lagoon.type: basic
      lagoon.volumes.dtrack-data.path: /data
      lagoon.service.port: 8080
    deploy:
      resources:
        limits:
          memory: 12288m
        reservations:
          memory: 8192m
      restart_policy:
        condition: on-failure
    ports:
    - '8081:8080'
    volumes:
    - 'dtrack-data:/data'
    restart: unless-stopped

  frontend:
    build:
      context: ./.lagoon
      dockerfile: frontend.dockerfile
    depends_on:
      apiserver:
        condition: service_healthy
    environment:
      # The base URL of the API server.
      # NOTE:
      #   * This URL must be reachable by the browsers of your users.
      #   * The frontend container itself does NOT communicate with the API server directly, it just serves static files.
      #   * When deploying to dedicated servers, please use the external IP or domain of the API server.
      API_BASE_URL: "http://localhost:8081"
      # OIDC_ISSUER: ""
      # OIDC_CLIENT_ID: ""
      # OIDC_SCOPE: ""
      # OIDC_FLOW: ""
      # OIDC_LOGIN_BUTTON_TEXT: ""
      # volumes:
      # - "/host/path/to/config.json:/app/static/config.json"
    ports:
      - "8080:8080"
    restart: unless-stopped
    labels:
      lagoon.type: basic
      lagoon.service.port: 8080

  postgres:
    image: uselagoon/postgres-17:latest
    labels:
      lagoon.type: postgres
      lando.type: postgres
    ports:
      - "5432" # exposes the port 5432 with a random local port, find it with `docker compose port postgres 5432`
    # << : *default-user # uses the defined user from top
    # environment:
    #   << : *default-environment
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lagoon -d lagoon" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  dtrack-data:
      labels:
        # this label is required to ensure the volume is created by Lagoon
        lagoon.type: persistent
  files: {}
  db: {}
